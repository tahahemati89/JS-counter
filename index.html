<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="flex justify-center items-center">

    <div
        class="select-none shadow-[0_0_20px_rgb(0_0_0_/_20%)] flex flex-col gap-8 items-center justify-center p-6 text-white bg-white/10 w-[22rem] h-[14rem] rounded-3xl border-[1px] border-white/30">
        <h3 class="countElement text-center text-3xl">0</h3>
        <div class="flex justify-center items-center gap-4">
            <button
                class="reduction shadow-[0_0_20px_rgb(0_0_0_/_20%)] text-4xl px-4 py-1 bg-white/30 rounded-full hover:bg-white/20">-</button>
            <button
                class="reset shadow-[0_0_20px_rgb(0_0_0_/_20%)] px-6 py-3 bg-[linear-gradient(135deg,#077fc5,#0db1b1)] rounded-2xl hover:hover:bg-[linear-gradient(135deg,#066da8,#0a9696)]">Reset</button>
            <button
                class="increase shadow-[0_0_20px_rgb(0_0_0_/_20%)] text-4xl px-3.5 py-1 bg-white/30 rounded-full hover:bg-white/20">+</button>
        </div>
    </div>

    <!-- scripts -->
    <script src="./main.js"></script>
</body>

</html>
